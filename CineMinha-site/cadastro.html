<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro - CineMinha</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <a href="index.html">
        <img src="img/CineMinha.png" alt="CineMinha" class="logo">
    </a>

    <nav>
        <div class="nav-actions">
        </div>
    </nav>
</header>

<!-- FUNDO -->
<div class="cadastro-bg"></div>

<!-- FORM -->
<section class="cadastro-container">

    <div class="cadastro-box">

        <h1>Crie sua conta</h1>

        <form>

            <div class="input-group">
                <label>Nome</label>
                <input type="text" placeholder="Seu nome">
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="seu@email.com">
            </div>

            <div class="input-group">
                <label>Senha</label>
                <input type="password" placeholder="********">
            </div>

            <div class="input-group">
                <label>Confirmar senha</label>
                <input type="password" placeholder="********">
            </div>

            <button class="botao">Criar Conta</button>

        </form>

    </div>

</section>

<footer>
    <p>© 2026 CineMinha</p>
</footer>

</body>
</html>
